<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>品牌问题</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
  .page-num{position:absolute;left:120px;top:88px;font-weight:900;font-size:20px;letter-spacing:5px;}
  .page-num span{background:#F06F61;color:#FFF8EA;padding:6px 14px;border-radius:6px;}
  .head-title{font-weight:900;font-size:44px;line-height:1.25;}
  .head-title em{font-style:normal;position:relative;display:inline-block;}
  .head-title em::before{content:"";position:absolute;left:-4px;right:-4px;top:60%;bottom:10%;background:#F6C945;z-index:-1;border-radius:4px;}
  .problem{position:relative;padding:26px 28px;border:3px solid #1F2024;border-radius:18px;box-shadow:6px 6px 0 #1F2024;}
  .p-num{font-family:Inter,Arial,sans-serif;font-weight:900;font-size:60px;line-height:1;position:absolute;top:-30px;left:20px;padding:6px 14px;border:3px solid #1F2024;border-radius:12px;background:#FFF8EA;}
  .p-title{font-weight:900;font-size:26px;margin-top:16px;margin-bottom:8px;}
  .p-desc{font-size:22px;line-height:1.55;color:#243B75;}
  .conclusion{position:absolute;left:120px;bottom:110px;right:120px;padding:24px 32px;background:#1F2024;color:#FFF8EA;border-radius:16px;font-weight:700;font-size:26px;display:flex;align-items:center;gap:18px;box-shadow:8px 8px 0 #F06F61;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div class="page-num"><span>04 / 16</span> &nbsp; BRAND PROBLEM · 品牌问题</div>

  <svg style="position:absolute;right:140px;top:80px;" width="200" height="60" viewBox="0 0 200 60">
    <polyline points="0,50 20,10 40,50 60,10 80,50 100,10 120,50 140,10 160,50 180,10 200,50" stroke="#8068C9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div style="position:absolute;right:120px;top:150px;width:28px;height:28px;background:#54C6B1;border-radius:50%;"></div>

  <div style="position:absolute;left:120px;top:180px;width:1680px;">
    <div class="head-title">
      当前品牌的问题，不是<em style="color:#F06F61;">缺少传播</em>，<br>
      而是品牌与用户之间<em style="color:#8068C9;">缺少真实连接</em>。
    </div>
  </div>

  <div style="position:absolute;left:120px;top:440px;width:1680px;height:400px;">

    <div class="problem" style="background:#F4C9C5;width:380px;position:absolute;left:0;top:20px;transform:rotate(-1.5deg);">
      <div class="p-num" style="background:#F06F61;color:#FFF8EA;">01</div>
      <div class="p-title">视觉年轻，但表达老套</div>
      <div class="p-desc">画面换了颜色和字体，语气却停留在几年前的说服句式。</div>
      <i class="fas fa-palette" style="position:absolute;right:22px;bottom:22px;color:#1F2024;font-size:36px;opacity:.6;"></i>
    </div>

    <div class="problem" style="background:#F6C945;width:380px;position:absolute;left:410px;top:0;transform:rotate(1.5deg);">
      <div class="p-num" style="background:#243B75;color:#FFF8EA;">02</div>
      <div class="p-title">内容热闹，但缺少主题</div>
      <div class="p-desc">选题一直在换，用户记不住品牌到底想讲什么。</div>
      <i class="fas fa-shapes" style="position:absolute;right:22px;bottom:22px;color:#1F2024;font-size:36px;opacity:.65;"></i>
    </div>

    <div class="problem" style="background:#54C6B1;width:380px;position:absolute;left:820px;top:20px;transform:rotate(-1deg);">
      <div class="p-num" style="background:#243B75;color:#FFF8EA;">03</div>
      <div class="p-title">产品有价值，但场景不清晰</div>
      <div class="p-desc">用户知道你有什么，却不知道自己什么时候会用你。</div>
      <i class="fas fa-map-marked-alt" style="position:absolute;right:22px;bottom:22px;color:#1F2024;font-size:36px;opacity:.6;"></i>
    </div>

    <div class="problem" style="background:#8068C9;color:#FFF8EA;width:380px;position:absolute;left:1230px;top:0;transform:rotate(1deg);">
      <div class="p-num" style="background:#F6C945;color:#1F2024;">04</div>
      <div class="p-title" style="color:#FFF8EA;">活动有声量，但关系没沉淀</div>
      <div class="p-desc" style="color:#F4C9C5;">一次热闹结束后，用户就散了，品牌资产没有增长。</div>
      <i class="fas fa-user-slash" style="position:absolute;right:22px;bottom:22px;color:#F6C945;font-size:36px;"></i>
    </div>

    <svg style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 1680 400">
      <path d="M 380 130 Q 400 90 410 100" stroke="#1F2024" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
      <path d="M 790 100 Q 810 130 820 130" stroke="#1F2024" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
      <path d="M 1200 130 Q 1220 90 1230 100" stroke="#1F2024" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    </svg>

    <div style="position:absolute;left:395px;top:180px;width:24px;height:24px;background:#F06F61;border-radius:50%;"></div>
    <div style="position:absolute;left:805px;top:180px;width:24px;height:24px;background:#F6C945;border-radius:50%;border:3px solid #1F2024;"></div>
    <div style="position:absolute;left:1215px;top:180px;width:24px;height:24px;background:#54C6B1;border-radius:50%;"></div>
  </div>

  <div class="conclusion">
    <i class="fas fa-lightbulb" style="color:#F6C945;font-size:32px;"></i>
    <span>年轻用户会<span style="color:#F6C945;">快速识别</span>——"真正理解我"和"只是模仿我"的区别。</span>
    <span style="margin-left:auto;font-size:18px;opacity:.65;letter-spacing:2px;">· PROBLEM ·</span>
  </div>

</section>
</body>
</html>
