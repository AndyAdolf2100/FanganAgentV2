<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>策略框架</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
  .page-num{position:absolute;left:120px;top:88px;font-weight:900;font-size:20px;letter-spacing:5px;}
  .page-num span{background:#8068C9;color:#FFF8EA;padding:6px 14px;border-radius:6px;}
  .head-title{font-weight:900;font-size:44px;line-height:1.25;}
  .head-title em{font-style:normal;color:#F06F61;}
  .m-card{border:3px solid #1F2024;border-radius:20px;padding:22px 24px;box-shadow:6px 6px 0 #1F2024;position:relative;height:100%;box-sizing:border-box;}
  .m-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #1F2024;background:#FFF8EA;font-size:26px;}
  .m-title{font-weight:900;font-size:26px;margin:12px 0 6px;}
  .m-q{font-size:20px;color:#243B75;line-height:1.55;}
  .m-action{margin-top:10px;padding:8px 12px;background:#1F2024;color:#FFF8EA;border-radius:8px;font-size:16px;font-weight:700;display:inline-block;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div class="page-num"><span>08 / 16</span> &nbsp; STRATEGY FRAMEWORK · 策略框架</div>

  <svg style="position:absolute;right:130px;top:80px;" width="240" height="60" viewBox="0 0 240 60">
    <path d="M0 30 Q 20 5 40 30 T 80 30 T 120 30 T 160 30 T 200 30 T 240 30" stroke="#54C6B1" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>
  <i class="fas fa-star" style="position:absolute;right:140px;top:150px;color:#F6C945;font-size:28px;"></i>

  <div style="position:absolute;left:120px;top:180px;width:1680px;">
    <div class="head-title">
      内容、产品和体验，<br>
      围绕<em style="color:#8068C9;">同一个品牌主题</em>协同工作。
    </div>
  </div>

  <div style="position:absolute;left:120px;top:380px;width:1680px;height:560px;">
    <svg style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 1680 560">
      <line x1="360" y1="140" x2="700" y2="280" stroke="#1F2024" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="1320" y1="140" x2="980" y2="280" stroke="#1F2024" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="360" y1="420" x2="700" y2="280" stroke="#1F2024" stroke-width="3" stroke-dasharray="8 6"/>
      <line x1="1320" y1="420" x2="980" y2="280" stroke="#1F2024" stroke-width="3" stroke-dasharray="8 6"/>
    </svg>

    <div style="position:absolute;left:640px;top:180px;width:400px;height:200px;background:#243B75;color:#FFF8EA;border:4px solid #1F2024;border-radius:24px;box-shadow:8px 8px 0 #F6C945;padding:24px;box-sizing:border-box;text-align:center;">
      <div style="font-size:16px;font-weight:800;letter-spacing:4px;color:#F6C945;">CENTER THEME</div>
      <div style="font-weight:900;font-size:28px;line-height:1.35;margin-top:12px;">
        让每一次选择，<br>都更接近<span style="color:#F6C945;">理想生活</span>
      </div>
    </div>
    <div style="position:absolute;left:620px;top:170px;width:18px;height:18px;background:#F06F61;border-radius:50%;"></div>
    <div style="position:absolute;left:1050px;top:370px;width:18px;height:18px;background:#54C6B1;border-radius:50%;"></div>

    <div class="m-card" style="background:#F4C9C5;position:absolute;left:0;top:0;width:360px;height:280px;transform:rotate(-1deg);">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="m-icon" style="background:#F06F61;color:#FFF8EA;"><i class="fas fa-heart"></i></div>
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:40px;color:#F06F61;">01</div>
      </div>
      <div class="m-title">核心主题</div>
      <div class="m-q">品牌要让用户记住什么？</div>
      <div class="m-action" style="background:#F06F61;">动作：定义一句话品牌主张</div>
    </div>

    <div class="m-card" style="background:#F6C945;position:absolute;right:0;top:0;width:360px;height:280px;transform:rotate(1deg);">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="m-icon" style="background:#243B75;color:#F6C945;"><i class="fas fa-comment-dots"></i></div>
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:40px;color:#243B75;">02</div>
      </div>
      <div class="m-title">内容表达</div>
      <div class="m-q">通过什么内容进入用户视野？</div>
      <div class="m-action" style="background:#243B75;">动作：季度主题 × 月度选题</div>
    </div>

    <div class="m-card" style="background:#54C6B1;position:absolute;left:0;bottom:0;width:360px;height:280px;transform:rotate(1deg);">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="m-icon" style="background:#243B75;color:#54C6B1;"><i class="fas fa-cube"></i></div>
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:40px;color:#243B75;">03</div>
      </div>
      <div class="m-title">产品体验</div>
      <div class="m-q">用户实际获得什么价值？</div>
      <div class="m-action" style="background:#243B75;">动作：主题限定与场景包</div>
    </div>

    <div class="m-card" style="background:#8068C9;color:#FFF8EA;position:absolute;right:0;bottom:0;width:360px;height:280px;transform:rotate(-1deg);">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="m-icon" style="background:#F6C945;color:#1F2024;"><i class="fas fa-users"></i></div>
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:40px;color:#F6C945;">04</div>
      </div>
      <div class="m-title" style="color:#FFF8EA;">社交参与</div>
      <div class="m-q" style="color:#F4C9C5;">用户如何参与、分享和传播？</div>
      <div class="m-action" style="background:#F6C945;color:#1F2024;">动作：共创机制与社群运营</div>
    </div>

    <svg style="position:absolute;left:490px;top:60px;transform:rotate(15deg);" width="60" height="60" viewBox="0 0 60 60">
      <polygon points="30,4 56,52 4,52" fill="#56A8D8"/>
    </svg>
    <div style="position:absolute;right:490px;bottom:60px;width:70px;height:70px;background-image:radial-gradient(#1F2024 2.4px,transparent 2.6px);background-size:16px 16px;"></div>
  </div>

  <div style="position:absolute;left:120px;bottom:60px;right:120px;padding:16px 24px;background:#1F2024;color:#FFF8EA;border-radius:14px;font-weight:700;font-size:22px;display:flex;align-items:center;gap:16px;">
    <i class="fas fa-link" style="color:#F6C945;font-size:26px;"></i>
    <span>协同的检验标准：<span style="color:#F6C945;">同一句话</span>能在内容、产品、体验<span style="color:#54C6B1;">三个触点</span>被讲三遍。</span>
    <span style="margin-left:auto;font-size:14px;opacity:.7;">· FRAMEWORK ·</span>
  </div>

</section>
</body>
</html>
