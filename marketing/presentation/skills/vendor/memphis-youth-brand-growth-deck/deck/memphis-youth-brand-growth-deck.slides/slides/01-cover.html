<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:20px 20px;pointer-events:none;}
  .m-dots{position:absolute;background-image:radial-gradient(#1F2024 2.4px,transparent 2.6px);background-size:22px 22px;}
  .m-stripes{position:absolute;background:repeating-linear-gradient(45deg,#1F2024 0 4px,transparent 4px 12px);}
  .title-main{font-weight:500;font-size:118px;line-height:1.02;letter-spacing:-2px;color:#1F2024;}
  .title-tag{font-weight:800;font-size:20px;letter-spacing:6px;}
  .subtitle{font-weight:500;font-size:28px;line-height:1.7;color:#243B75;}
  .badge{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border:2.5px solid #1F2024;border-radius:999px;font-weight:800;font-size:20px;}
  .photo-wrap{position:absolute;right:120px;top:150px;width:640px;height:820px;}
  .photo-frame{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:0 24px 60px -20px rgba(31,32,36,.35);border:6px solid #1F2024;}
  .photo-frame img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-sticker{position:absolute;padding:12px 22px;background:#F6C945;border:3px solid #1F2024;border-radius:14px;font-weight:900;font-size:22px;box-shadow:4px 4px 0 #1F2024;}
  .num-block{position:absolute;left:120px;bottom:82px;display:flex;gap:26px;align-items:center;font-weight:800;font-size:16px;letter-spacing:2px;color:#1F2024;}
  .num-line{width:70px;height:3px;background:#1F2024;}
  .star{position:absolute;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div style="position:absolute;left:120px;top:98px;" class="title-tag">
    <span style="background:#1F2024;color:#FFF8EA;padding:10px 20px;border-radius:6px;">YOUTH · BRAND · GROWTH</span>
  </div>

  <div class="m-dots" style="left:120px;top:170px;width:170px;height:60px;"></div>
  <svg style="position:absolute;left:310px;top:170px;" width="200" height="60" viewBox="0 0 200 60">
    <path d="M0 30 Q 20 5 40 30 T 80 30 T 120 30 T 160 30 T 200 30" stroke="#54C6B1" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>

  <div style="position:absolute;left:120px;top:290px;max-width:1080px;">
    <div class="title-main">
      年轻品牌<br>
      <span style="position:relative;display:inline-block;">
        <span style="position:absolute;left:-16px;right:-16px;top:22%;bottom:14%;background:#F6C945;z-index:-1;border-radius:8px;"></span>
        增长方案
      </span>
    </div>
  </div>

  <div style="position:absolute;left:124px;top:664px;max-width:900px;">
    <div class="subtitle">
      用<span style="font-weight:800;color:#F06F61;">内容</span>、<span style="font-weight:800;color:#54C6B1;">场景</span>与<span style="font-weight:800;color:#8068C9;">体验</span>，<br>
      建立新一代用户的品牌关系。
    </div>
  </div>

  <div style="position:absolute;left:124px;top:820px;display:flex;gap:16px;align-items:center;">
    <span class="badge" style="background:#F06F61;color:#FFF8EA;border-color:#1F2024;transform:rotate(-4deg);">让品牌更有趣</span>
    <span class="badge" style="background:#54C6B1;color:#1F2024;transform:rotate(3deg);">让用户更愿意靠近</span>
  </div>

  <div class="num-block">
    <span>01</span><div class="num-line"></div>
    <span style="color:#243B75;">品牌营销策略提案</span>
    <div class="num-line"></div>
    <span style="color:#8068C9;">COVER</span>
  </div>

  <div class="photo-wrap">
    <div style="position:absolute;left:-70px;top:-40px;width:180px;height:180px;border-radius:50%;background:#54C6B1;z-index:1;"></div>
    <div style="position:absolute;right:-60px;bottom:100px;width:220px;height:220px;background:#8068C9;border-radius:50%;z-index:1;"></div>
    <div class="m-stripes" style="right:-80px;top:70px;width:150px;height:150px;border-radius:50%;z-index:1;"></div>

    <div class="photo-frame" style="z-index:2;">
      <img src="https://agent-assets-test.aippt.cn/skills/user/aippt-test/9eca7bd06d77f7b5/01a089700c957bf2ab5f2c7d1db20b48/assets/ext/7b4c0297445eb53f.png" alt="young lifestyle">
    </div>

    <div class="photo-sticker" style="left:-46px;top:60px;transform:rotate(-6deg);z-index:3;">HELLO YOUTH!</div>
    <div class="photo-sticker" style="right:-40px;top:340px;background:#56A8D8;color:#FFF8EA;transform:rotate(6deg);z-index:3;">GROWTH · 2.0</div>
    <div class="photo-sticker" style="left:60px;bottom:-24px;background:#F06F61;color:#FFF8EA;transform:rotate(-3deg);z-index:3;">让品牌被选择</div>
  </div>

  <div class="m-dots" style="right:60px;bottom:60px;width:110px;height:120px;"></div>

  <i class="fas fa-star star" style="left:520px;top:200px;font-size:26px;color:#8068C9;"></i>
  <i class="fas fa-star star" style="left:46px;top:520px;font-size:22px;color:#F06F61;"></i>
  <i class="fas fa-star star" style="left:70px;bottom:230px;font-size:30px;color:#54C6B1;"></i>

  <svg style="position:absolute;left:120px;top:864px;" width="140" height="30" viewBox="0 0 140 30">
    <polyline points="0,25 15,5 30,25 45,5 60,25 75,5 90,25 105,5 120,25 135,5" stroke="#F06F61" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>

  <svg style="position:absolute;left:920px;top:180px;transform:rotate(20deg);" width="86" height="86" viewBox="0 0 86 86">
    <polygon points="43,4 82,78 4,78" fill="#56A8D8"/>
  </svg>

  <div style="position:absolute;left:1060px;top:130px;width:52px;height:52px;background:#F06F61;border-radius:50%;"></div>

</section>
</body>
</html>
