server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;
  location /api/presentation-drafts/ {
    proxy_pass http://preview:8001;
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
  }
  location /api/enterprise-templates {
    client_max_body_size 170m;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /docs { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
