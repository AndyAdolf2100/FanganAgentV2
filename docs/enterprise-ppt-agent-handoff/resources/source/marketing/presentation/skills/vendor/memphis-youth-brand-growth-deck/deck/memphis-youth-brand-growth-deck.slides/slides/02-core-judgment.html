<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>核心判断</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
  .m-dots{position:absolute;background-image:radial-gradient(#1F2024 2px,transparent 2.4px);background-size:20px 20px;}
  .page-num{position:absolute;left:120px;top:88px;font-weight:900;font-size:20px;letter-spacing:5px;color:#1F2024;}
  .page-num span{background:#F06F61;color:#FFF8EA;padding:6px 14px;border-radius:6px;}
  .head-title{font-weight:900;font-size:48px;line-height:1.2;letter-spacing:-1px;color:#1F2024;}
  .head-title em{font-style:normal;position:relative;display:inline-block;}
  .head-title em::before{content:"";position:absolute;left:-6px;right:-6px;top:60%;bottom:10%;background:#F6C945;z-index:-1;border-radius:4px;}
  .kw-card{border:3px solid #1F2024;border-radius:18px;padding:22px 26px;box-shadow:6px 6px 0 #1F2024;position:relative;}
  .kw-num{font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#1F2024;}
  .kw-title{font-weight:900;font-size:32px;margin:6px 0 8px;color:#1F2024;}
  .kw-desc{font-size:22px;line-height:1.55;color:#243B75;}
  .conclusion{position:absolute;left:120px;bottom:100px;right:120px;padding:22px 30px;background:#243B75;color:#FFF8EA;border-radius:16px;font-weight:700;font-size:26px;display:flex;align-items:center;gap:18px;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div class="page-num"><span>02 / 16</span> &nbsp; CORE JUDGMENT · 核心判断</div>

  <svg style="position:absolute;right:140px;top:90px;" width="240" height="60" viewBox="0 0 240 60">
    <path d="M0 30 Q 20 5 40 30 T 80 30 T 120 30 T 160 30 T 200 30 T 240 30" stroke="#54C6B1" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="m-dots" style="right:140px;top:150px;width:120px;height:50px;"></div>
  <i class="fas fa-star" style="position:absolute;right:110px;top:180px;color:#F06F61;font-size:28px;"></i>

  <div style="position:absolute;left:120px;top:200px;width:820px;">
    <div class="head-title">
      年轻品牌的增长，<br>
      不只是变得<em style="color:#F06F61;">更年轻</em>，<br>
      而是变得<em style="color:#8068C9;">更值得</em>被<em>选择</em>。
    </div>

    <div style="margin-top:60px;position:relative;height:200px;">
      <div style="position:absolute;left:0;top:20px;width:120px;height:120px;background:#F06F61;border-radius:50%;"></div>
      <div style="position:absolute;left:100px;top:60px;width:80px;height:80px;background:#F6C945;transform:rotate(15deg);"></div>
      <svg style="position:absolute;left:210px;top:40px;" width="140" height="140" viewBox="0 0 140 140">
        <polygon points="70,10 130,120 10,120" fill="#54C6B1"/>
      </svg>
      <svg style="position:absolute;left:370px;top:70px;" width="140" height="60" viewBox="0 0 140 60">
        <path d="M0 30 Q 15 5 30 30 T 60 30 T 90 30 T 120 30 T 140 30" stroke="#8068C9" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
      <div style="position:absolute;left:530px;top:40px;width:100px;height:100px;background-image:radial-gradient(#1F2024 3px,transparent 3.4px);background-size:20px 20px;"></div>
    </div>
  </div>

  <div style="position:absolute;right:120px;top:220px;width:780px;display:grid;grid-template-columns:1fr 1fr;gap:26px;">
    <div class="kw-card" style="background:#F4C9C5;transform:rotate(-1.5deg);">
      <div class="kw-num">01</div>
      <div class="kw-title">看起来年轻</div>
      <div class="kw-desc">视觉与语气的年轻化，只解决"第一眼"的问题。</div>
    </div>
    <div class="kw-card" style="background:#F6C945;transform:rotate(1.5deg);">
      <div class="kw-num">02</div>
      <div class="kw-title">理解用户</div>
      <div class="kw-desc">读懂年轻用户的表达、态度与选择逻辑。</div>
    </div>
    <div class="kw-card" style="background:#54C6B1;transform:rotate(1deg);">
      <div class="kw-num">03</div>
      <div class="kw-title">进入场景</div>
      <div class="kw-desc">出现在真实生活的具体时刻，成为解决方案。</div>
    </div>
    <div class="kw-card" style="background:#8068C9;color:#FFF8EA;transform:rotate(-1deg);">
      <div class="kw-num" style="color:#FFF8EA;">04</div>
      <div class="kw-title" style="color:#FFF8EA;">持续选择</div>
      <div class="kw-desc" style="color:#FFF8EA;">从被看见到被记住，再到被主动选择。</div>
    </div>
  </div>

  <div style="position:absolute;right:60px;top:290px;width:36px;height:36px;background:#F06F61;border-radius:50%;"></div>
  <div style="position:absolute;right:76px;bottom:280px;width:24px;height:24px;background:#243B75;border-radius:50%;"></div>

  <div class="conclusion">
    <i class="fas fa-bullseye" style="color:#F6C945;font-size:32px;"></i>
    <span>年轻化<span style="color:#F6C945;">不是装饰风格</span>，而是一套<span style="color:#54C6B1;">真实的品牌关系</span>。</span>
    <span style="margin-left:auto;font-size:18px;opacity:.7;letter-spacing:2px;">· CORE JUDGMENT ·</span>
  </div>

</section>
</body>
</html>
