<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户路径</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
  .page-num{position:absolute;left:120px;top:88px;font-weight:900;font-size:20px;letter-spacing:5px;}
  .page-num span{background:#54C6B1;color:#1F2024;padding:6px 14px;border-radius:6px;}
  .head-title{font-weight:900;font-size:42px;line-height:1.25;}
  .head-title em{font-style:normal;color:#F06F61;}
  .node{position:relative;border:3px solid #1F2024;border-radius:16px;padding:18px 16px;text-align:center;box-shadow:5px 5px 0 #1F2024;box-sizing:border-box;}
  .n-num{font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;line-height:1;}
  .n-name{font-weight:900;font-size:22px;margin:6px 0 4px;}
  .n-action{font-size:15px;color:#243B75;line-height:1.4;}
  .n-metric{margin-top:8px;padding:4px 10px;background:#1F2024;color:#FFF8EA;border-radius:6px;font-size:14px;font-weight:800;display:inline-block;}
  .drop-star{position:absolute;padding:6px 10px;background:#F06F61;color:#FFF8EA;border:3px solid #1F2024;border-radius:8px;font-weight:900;font-size:14px;transform:rotate(-6deg);box-shadow:3px 3px 0 #1F2024;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div class="page-num"><span>10 / 16</span> &nbsp; USER JOURNEY · 用户路径</div>

  <div style="position:absolute;right:140px;top:80px;width:120px;height:60px;background-image:radial-gradient(#1F2024 2.4px,transparent 2.6px);background-size:20px 20px;"></div>

  <div style="position:absolute;left:120px;top:180px;width:1680px;">
    <div class="head-title">
      一次传播带来<em>注意力</em>，<br>
      持续体验才能形成<em style="color:#8068C9;">品牌记忆</em>。
    </div>
  </div>

  <div style="position:absolute;left:120px;top:390px;width:1680px;">
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:14px;">
      <div class="node" style="background:#F4C9C5;">
        <div class="n-num" style="color:#F06F61;">01</div>
        <div class="n-name">看到</div>
        <div class="n-action">第一次注意到品牌</div>
        <div class="n-metric" style="background:#F06F61;">100.0 万</div>
      </div>
      <div class="node" style="background:#F6C945;">
        <div class="n-num" style="color:#243B75;">02</div>
        <div class="n-name">停留</div>
        <div class="n-action">继续阅读、观看</div>
        <div class="n-metric" style="background:#243B75;">31.0 万</div>
      </div>
      <div class="node" style="background:#54C6B1;">
        <div class="n-num" style="color:#243B75;">03</div>
        <div class="n-name">理解</div>
        <div class="n-action">知道品牌解决什么</div>
        <div class="n-metric" style="background:#243B75;">18.6 万</div>
      </div>
      <div class="node" style="background:#56A8D8;color:#FFF8EA;">
        <div class="n-num" style="color:#F6C945;">04</div>
        <div class="n-name" style="color:#FFF8EA;">参与</div>
        <div class="n-action" style="color:#FFF8EA;">评论、收藏、分享</div>
        <div class="n-metric" style="background:#F6C945;color:#1F2024;">9.2 万</div>
      </div>
      <div class="node" style="background:#8068C9;color:#FFF8EA;">
        <div class="n-num" style="color:#F6C945;">05</div>
        <div class="n-name" style="color:#FFF8EA;">行动</div>
        <div class="n-action" style="color:#FFF8EA;">购买、咨询、体验</div>
        <div class="n-metric" style="background:#F6C945;color:#1F2024;">2.7 万</div>
      </div>
      <div class="node" style="background:#243B75;color:#FFF8EA;">
        <div class="n-num" style="color:#F6C945;">06</div>
        <div class="n-name" style="color:#FFF8EA;">复购</div>
        <div class="n-action" style="color:#FFF8EA;">持续使用并推荐</div>
        <div class="n-metric" style="background:#F6C945;color:#1F2024;">9,800</div>
      </div>
    </div>

    <div style="margin-top:24px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:0 130px;">
      <div style="text-align:center;">
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#F06F61;">→ 31%</div>
        <div style="font-size:15px;color:#243B75;">停留</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#F06F61;">→ 60%</div>
        <div style="font-size:15px;color:#243B75;">理解</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#F06F61;">→ 49%</div>
        <div style="font-size:15px;color:#243B75;">参与</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#F06F61;">→ 29%</div>
        <div style="font-size:15px;color:#243B75;">行动</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:Inter,Arial,sans-serif;font-weight:900;font-size:28px;color:#F06F61;">→ 36%</div>
        <div style="font-size:15px;color:#243B75;">复购</div>
      </div>
    </div>

    <div style="margin-top:26px;height:170px;position:relative;">
      <svg width="100%" height="170" viewBox="0 0 1680 170" preserveAspectRatio="none">
        <polygon points="0,10 260,10 260,160 0,160" fill="#F4C9C5" stroke="#1F2024" stroke-width="3"/>
        <polygon points="278,25 538,25 538,150 278,150" fill="#F6C945" stroke="#1F2024" stroke-width="3"/>
        <polygon points="556,40 816,40 816,140 556,140" fill="#54C6B1" stroke="#1F2024" stroke-width="3"/>
        <polygon points="834,55 1094,55 1094,130 834,130" fill="#56A8D8" stroke="#1F2024" stroke-width="3"/>
        <polygon points="1112,70 1372,70 1372,120 1112,120" fill="#8068C9" stroke="#1F2024" stroke-width="3"/>
        <polygon points="1390,85 1650,85 1650,110 1390,110" fill="#243B75" stroke="#1F2024" stroke-width="3"/>
      </svg>

      <div class="drop-star" style="left:240px;top:0;">流失 69%</div>
      <div class="drop-star" style="left:790px;top:-5px;background:#8068C9;transform:rotate(4deg);">高流失点</div>
      <div class="drop-star" style="left:1080px;top:0;background:#F06F61;">决策关口</div>
    </div>

  </div>

  <svg style="position:absolute;left:60px;top:400px;transform:rotate(-8deg);" width="60" height="60" viewBox="0 0 60 60">
    <path d="M30 4 L36 24 L56 24 L40 36 L46 56 L30 44 L14 56 L20 36 L4 24 L24 24 Z" fill="#F6C945" stroke="#1F2024" stroke-width="2.5"/>
  </svg>

  <div style="position:absolute;left:120px;bottom:60px;right:120px;padding:14px 24px;background:#F06F61;color:#FFF8EA;border-radius:14px;font-weight:800;font-size:22px;display:flex;align-items:center;gap:16px;">
    <i class="fas fa-route" style="color:#F6C945;font-size:26px;"></i>
    <span>关注<span style="color:#F6C945;">流失最大的两个环节</span>：参与→行动、行动→复购。</span>
    <span style="margin-left:auto;font-size:14px;opacity:.85;">数据状态：示意数据｜口径：单季度全渠道</span>
  </div>

</section>
</body>
</html>
