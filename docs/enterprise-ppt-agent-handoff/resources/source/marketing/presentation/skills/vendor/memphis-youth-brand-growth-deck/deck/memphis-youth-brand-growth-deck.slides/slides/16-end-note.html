<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>尾页</title>
<link href="https://agent-resource-test.aippt.cn/lib/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://agent-resource-test.aippt.cn/lib/fontawesome-all.min.css">
<style>
  body{margin:0;font-family:"HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei","Alibaba PuHuiTi",sans-serif;color:#1F2024;}
  .slide{width:1920px;height:1080px;position:relative;overflow:hidden;background:#FFF8EA;}
  .grain{position:absolute;inset:0;opacity:.05;background-image:radial-gradient(#1F2024 1px,transparent 1px);background-size:22px 22px;pointer-events:none;}
  .page-num{position:absolute;left:120px;top:88px;font-weight:900;font-size:20px;letter-spacing:5px;}
  .page-num span{background:#8068C9;color:#FFF8EA;padding:6px 14px;border-radius:6px;}
  .title-main{font-weight:900;font-size:66px;line-height:1.12;letter-spacing:-1.5px;color:#1F2024;}
  .title-main em{font-style:normal;position:relative;display:inline-block;}
  .title-main em::before{content:"";position:absolute;left:-8px;right:-8px;top:60%;bottom:12%;background:#F6C945;z-index:-1;border-radius:6px;}
  .sub{font-size:26px;line-height:1.65;color:#243B75;font-weight:500;}
  .loop-node{padding:12px 18px;border:3px solid #1F2024;border-radius:999px;font-weight:900;font-size:18px;box-shadow:4px 4px 0 #1F2024;background:#FFF8EA;}
  .action-card{background:#FFF8EA;border:3px solid #1F2024;border-radius:16px;padding:16px 20px;box-shadow:4px 4px 0 #1F2024;display:flex;gap:14px;align-items:flex-start;}
  .action-num{font-family:Inter,Arial,sans-serif;font-weight:900;font-size:22px;color:#F06F61;flex-shrink:0;}
  .action-text{font-size:20px;font-weight:700;color:#1F2024;line-height:1.5;}
</style>
</head>
<body>
<section class="slide">
  <div class="grain"></div>

  <div class="page-num"><span>16 / 16</span> &nbsp; END NOTE · 讨论与确认</div>

  <div style="position:absolute;right:80px;top:120px;width:560px;height:560px;">
    <div style="position:absolute;left:120px;top:0;width:220px;height:220px;background:#F06F61;border-radius:50%;"></div>
    <div style="position:absolute;left:340px;top:180px;width:140px;height:140px;background:#54C6B1;border-radius:50%;"></div>
    <div style="position:absolute;left:40px;top:280px;width:180px;height:180px;background:#F6C945;border-radius:50%;"></div>
    <div style="position:absolute;left:380px;top:60px;width:80px;height:80px;background:#8068C9;border-radius:50%;"></div>
    <svg style="position:absolute;left:220px;top:400px;transform:rotate(-15deg);" width="140" height="140" viewBox="0 0 140 140">
      <polygon points="70,10 130,130 10,130" fill="#56A8D8"/>
    </svg>
    <div style="position:absolute;right:20px;top:280px;width:110px;height:110px;background-image:radial-gradient(#1F2024 3px,transparent 3.4px);background-size:22px 22px;"></div>
    <svg style="position:absolute;left:-10px;top:180px;" width="180" height="60" viewBox="0 0 180 60">
      <path d="M0 30 Q 15 5 30 30 T 60 30 T 90 30 T 120 30 T 150 30 T 180 30" stroke="#1F2024" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;right:80px;top:60px;width:120px;height:120px;background:repeating-linear-gradient(45deg,#1F2024 0 4px,transparent 4px 12px);border-radius:50%;border:3px solid #1F2024;"></div>
    <svg style="position:absolute;left:100px;top:180px;transform:rotate(10deg);" width="80" height="80" viewBox="0 0 80 80">
      <path d="M40 6 L48 32 L74 32 L54 48 L62 74 L40 58 L18 74 L26 48 L6 32 L32 32 Z" fill="#FFF8EA" stroke="#1F2024" stroke-width="3"/>
    </svg>
    <svg style="position:absolute;left:60px;bottom:0;" width="200" height="30" viewBox="0 0 200 30">
      <polyline points="0,25 20,5 40,25 60,5 80,25 100,5 120,25 140,5 160,25 180,5 200,25" stroke="#1F2024" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div style="position:absolute;left:120px;top:200px;width:1120px;">
    <div class="title-main">
      让品牌不只<em>被看见</em>，<br>
      更成为用户<em style="color:#F06F61;">愿意主动选择</em>的答案。
    </div>

    <div class="sub" style="margin-top:26px;">
      年轻化不是装饰风格，而是一套<span style="color:#F06F61;font-weight:800;">真实理解用户</span>、<br>
      <span style="color:#54C6B1;font-weight:800;">进入场景</span>、<span style="color:#8068C9;font-weight:800;">持续创造价值</span>的品牌关系。
    </div>
  </div>

  <div style="position:absolute;left:120px;top:610px;width:1200px;">
    <div style="font-weight:900;font-size:18px;letter-spacing:3px;color:#1F2024;margin-bottom:14px;">
      <span style="background:#1F2024;color:#FFF8EA;padding:6px 14px;border-radius:6px;">最终闭环 · FINAL LOOP</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <span class="loop-node" style="background:#F4C9C5;">理解用户</span>
      <i class="fas fa-arrow-right" style="color:#1F2024;font-size:20px;"></i>
      <span class="loop-node" style="background:#F6C945;">进入场景</span>
      <i class="fas fa-arrow-right" style="color:#1F2024;font-size:20px;"></i>
      <span class="loop-node" style="background:#F06F61;color:#FFF8EA;">内容表达</span>
      <i class="fas fa-arrow-right" style="color:#1F2024;font-size:20px;"></i>
      <span class="loop-node" style="background:#54C6B1;">真实体验</span>
      <i class="fas fa-arrow-right" style="color:#1F2024;font-size:20px;"></i>
      <span class="loop-node" style="background:#56A8D8;color:#FFF8EA;">用户参与</span>
      <i class="fas fa-arrow-right" style="color:#1F2024;font-size:20px;"></i>
      <span class="loop-node" style="background:#8068C9;color:#FFF8EA;">持续关系</span>
    </div>
  </div>

  <div style="position:absolute;left:120px;top:790px;width:1560px;">
    <div style="font-weight:900;font-size:18px;letter-spacing:3px;color:#1F2024;margin-bottom:12px;">
      <span style="background:#F06F61;color:#FFF8EA;padding:6px 14px;border-radius:6px;">下一步动作 · NEXT ACTIONS</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;">
      <div class="action-card">
        <div class="action-num">01</div>
        <div class="action-text">聚焦一个<br>核心用户群</div>
      </div>
      <div class="action-card">
        <div class="action-num" style="color:#F6C945;">02</div>
        <div class="action-text">统一一个<br>品牌主题</div>
      </div>
      <div class="action-card">
        <div class="action-num" style="color:#54C6B1;">03</div>
        <div class="action-text">验证三个<br>重点场景</div>
      </div>
      <div class="action-card">
        <div class="action-num" style="color:#56A8D8;">04</div>
        <div class="action-text">建立一套<br>内容指标</div>
      </div>
      <div class="action-card">
        <div class="action-num" style="color:#8068C9;">05</div>
        <div class="action-text">持续复盘<br>沉淀品牌资产</div>
      </div>
    </div>
  </div>

  <div style="position:absolute;left:120px;bottom:60px;right:120px;padding:14px 24px;background:#243B75;color:#FFF8EA;border-radius:14px;font-weight:800;font-size:22px;display:flex;align-items:center;gap:16px;">
    <i class="fas fa-comments" style="color:#F6C945;font-size:26px;"></i>
    <span>讨论与确认——从<span style="color:#F6C945;">"被看见"</span>到<span style="color:#54C6B1;">"被记住"</span>，再到<span style="color:#F06F61;">"被选择"</span>。</span>
    <span style="margin-left:auto;font-size:16px;opacity:.7;letter-spacing:2px;">·  THE END ·</span>
  </div>

</section>
</body>
</html>
