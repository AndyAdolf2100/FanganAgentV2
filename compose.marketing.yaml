name: marketing-v2-agent
services:
  api:
    build:
      context: .
      dockerfile: marketing/Dockerfile
    environment:
      MARKETING_RUNTIME: ${MARKETING_RUNTIME:-demo}
      MARKETING_API_KEY: ${MARKETING_API_KEY:-}
      MARKETING_MODEL: ${MARKETING_MODEL:-glm-5}
      MARKETING_BASE_URL: ${MARKETING_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      MARKETING_RECURSION_LIMIT: ${MARKETING_RECURSION_LIMIT:-80}
      MARKETING_DATA_DIR: /data/marketing
      MARKETING_PPT_CUSTOM_PAGES: ${MARKETING_PPT_CUSTOM_PAGES:-4}
      MARKETING_PPT_PAGE_CALL_LIMIT: ${MARKETING_PPT_PAGE_CALL_LIMIT:-8}
      MARKETING_IMAGE_BASE_URL: ${MARKETING_IMAGE_BASE_URL:-}
      MARKETING_IMAGE_API_KEY: ${MARKETING_IMAGE_API_KEY:-}
      MARKETING_IMAGE_MODEL: ${MARKETING_IMAGE_MODEL:-}
      MARKETING_IMAGE_SIZE: ${MARKETING_IMAGE_SIZE:-2048x1152}
      MARKETING_IMAGE_PRICE_RMB: ${MARKETING_IMAGE_PRICE_RMB:-0}
      MARKETING_IMAGE_BUDGET_RMB: ${MARKETING_IMAGE_BUDGET_RMB:-20}
      MARKETING_IMAGE_MAX_REQUESTS: ${MARKETING_IMAGE_MAX_REQUESTS:-1}
      MARKETING_IMAGE_ENABLED: ${MARKETING_IMAGE_ENABLED:-true}
      MARKETING_VISION_ENABLED: ${MARKETING_VISION_ENABLED:-false}
      MARKETING_VISION_MODEL: ${MARKETING_VISION_MODEL:-doubao-seed-2-0-mini-260428}
      MARKETING_VISION_MAX_REQUESTS: ${MARKETING_VISION_MAX_REQUESTS:-16}
      MARKETING_PPT_BUDGET_RMB: ${MARKETING_PPT_BUDGET_RMB:-5}
      DEER_FLOW_PROJECT_ROOT: /app
      DEER_FLOW_HOME: /data/deerflow
      DEER_FLOW_CONFIG_PATH: /app/config.marketing.yaml
    volumes:
      - marketing_data:/data
      - ./marketing/marketing_agent:/app/marketing/marketing_agent:ro
      - ./config.marketing.yaml:/app/config.marketing.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s
  preview:
    image: marketing-v2-agent-api
    build:
      context: .
      dockerfile: marketing/Dockerfile
    command: [uvicorn, marketing_agent.presentation_preview:app, --host, 0.0.0.0, --port, "8001", --workers, "1"]
    environment:
      MARKETING_DATA_DIR: /data/marketing
    volumes:
      - marketing_data:/data:ro
      - ./marketing/marketing_agent:/app/marketing/marketing_agent:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build: ./marketing/frontend
    ports:
      - "127.0.0.1:${MARKETING_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
      preview:
        condition: service_healthy
    restart: unless-stopped
volumes:
  marketing_data:
